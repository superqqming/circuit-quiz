<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>電路接線練習</title>
<style>
  :root { --bg: #f3f4f6; --panel: #fff; --ink: #1d2330; --muted: #6b7383; --line: #dde1e7; --accent: #1f6feb; --bad: #c92a2a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15181c; --panel: #1e2228; --ink: #e6e8eb; --muted: #9aa3ae; --line: #3a3f47; --accent: #4c8dff; --bad: #ff8787; } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; color: var(--ink); background: var(--bg); font-size: 15px; }
  #gate { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px 22px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; line-height: 1.6; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input, select, button { font: inherit; color: inherit; width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: transparent; }
  .row { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .row input { width: auto; }
  button.primary { margin-top: 18px; background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  button.primary:disabled { opacity: .6; cursor: default; }
  #msg { margin-top: 12px; font-size: 13px; min-height: 1.4em; line-height: 1.6; }
  #msg.err { color: var(--bad); }
  .note { margin-top: 16px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  #shell { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 6px 12px; font-size: 13px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #bar .spacer { flex: 1; }
  #bar button { width: auto; padding: 4px 10px; cursor: pointer; }
  #bar a { color: var(--accent); }
  #app { flex: 1; width: 100%; border: 0; background: #fff; }
</style>
</head>
<body>
<div id="gate">
  <form class="card" id="form" autocomplete="off">
    <h1>電路接線練習</h1>
    <p class="sub">課堂登入版<br>請用修課名單上的學號與姓名登入。</p>
    <label for="sid">學號</label>
    <input id="sid" type="password" spellcheck="false" autocapitalize="characters" required>
    <div class="row"><input type="checkbox" id="showSid"><label for="showSid" style="margin:0">顯示學號</label></div>
    <label for="name">姓名</label>
    <input id="name" type="text" spellcheck="false" required>
    <div id="pick" hidden>
      <label for="course">你在多門課的名單上，請選擇這次的課程</label>
      <select id="course"></select>
    </div>
    <button class="primary" id="go" type="submit">登入</button>
    <div id="msg" role="status"></div>
    <p class="note">學號與姓名只在這台電腦轉成雜湊後送出，不會傳送明文。老師請在「學號」欄填老師密碼。</p>
  </form>
</div>
<div id="shell" hidden>
  <div id="bar">
    <span>已登入：<b id="who"></b></span>
    <span id="courseName"></span>
    <a id="popout" href="#" target="_blank" rel="noopener" hidden>在新分頁開啟</a>
    <span class="spacer"></span>
    <button type="button" id="logout">登出</button>
  </div>
  <iframe id="app" title="工具"></iframe>
</div>

const TOKEN_KEY = 'course-ai-gateway:' + APP.gateway;
const USER_KEY = 'app-gate:' + APP.id;
window.__GATE_BUILD = PAYLOAD.id;
// 工具若有 AI 功能（ai-access.js），需要知道閘道網址才能提供「課程額度」那條路。
// APP 是 const，top-level 的 const 不會變成 window 的屬性，所以明確掛上去。
// 閘道網址不是祕密（config.json 裡就有）。
window.__GATE_APP = { id: APP.id, gateway: APP.gateway };

const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// 正規化：與 client/gateway-client.js、scripts/roster.py 逐字相同（打包時從 gateway-client.js 複製進來）
const STRIP_RE = /[\t\n\v\f\r \u0085\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000\u200b\u200c\u200d\u200e\u200f\u2060\ufeff\u00ad\u001c\u001d\u001e\u001f]+/g;
const VS_RE = /[\uFE00-\uFE0F]|\uDB40[\uDD00-\uDDEF]/g;
const clean = v => String(v || '').normalize('NFKC').replace(STRIP_RE, '').replace(VS_RE, '');
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const loginKey = async (sid, name) => hex(await crypto.subtle.digest('SHA-256', enc.encode(clean(sid).toUpperCase() + '\n' + clean(name).toLowerCase())));

const sget = k => { try { return sessionStorage.getItem(k); } catch { return null; } };
const sset = (k, v) => { try { if (v) sessionStorage.setItem(k, v); else sessionStorage.removeItem(k); } catch { /* 隱私模式 */ } };
function say(text, err) { $('msg').textContent = text || ''; $('msg').className = err ? 'err' : ''; }

async function openApp(keyB64, user) {
  const key = await crypto.subtle.importKey('raw', b64(keyB64), 'AES-GCM', false, ['decrypt']);
  let bundle;
  try {
    bundle = JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct))));
  } catch {
    throw new Error('這個網頁的版本和課程閘道上的鑰匙對不起來（工具剛更新過？）。請重新整理頁面；一直不行請通知老師。');
  }
  window.__GATE_USER = user;                  // 一定要在設定 srcdoc 之前放好：工具一啟動就會讀
  $('who').textContent = user.name;
  $('courseName').textContent = user.course ? `・${user.course.name}` : '';
  try { if (window.top !== window.self) { $('popout').href = location.href; $('popout').hidden = false; } } catch { $('popout').href = location.href; $('popout').hidden = false; }
  $('gate').hidden = true;
  $('shell').hidden = false;
  $('app').srcdoc = bundle.app;               // 同源 srcdoc：下載、列印、sessionStorage 都正常
  document.title = bundle.meta && bundle.meta.title || document.title;
}

async function call(path, opts = {}) {
  let res;
  try {
    res = await fetch(APP.gateway + path, { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  } catch { throw Object.assign(new Error('連不上課程閘道，請確認網路連線後再試。'), { code: 'network' }); }
  let d = null;
  try { d = await res.json(); } catch { /* 不是 JSON */ }
  if (!res.ok) throw Object.assign(new Error((d && d.message) || `課程閘道回應 ${res.status}`), { code: d && d.error, data: d, status: res.status });
  return d;
}

$('showSid').addEventListener('change', e => { $('sid').type = e.target.checked ? 'text' : 'password'; });

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const sid = $('sid').value, name = $('name').value.trim();
  if (!clean(sid) || !clean(name)) return say('請輸入學號與姓名。', true);
  $('go').disabled = true;
  say('登入中…');
  try {
    const k = await loginKey(sid, name);
    const body = { k, app: APP.id };
    if (!$('pick').hidden) body.course = $('course').value;
    const d = await call('/v1/login', { method: 'POST', body: JSON.stringify(body) });
    sset(TOKEN_KEY, d.token);
    const user = { name, k, course: d.course ? { id: d.course.id, name: d.course.name, endsAt: d.course.endsAt || null } : null };
    sset(USER_KEY, JSON.stringify(user));
    $('sid').value = '';                       // 不留在畫面上（老師的學號欄是密碼）
    await openApp(d.unlock.key, user);
  } catch (err) {
    if (err.code === 'choose_course') {
      const sel = $('course');
      sel.textContent = '';
      for (const c of err.data.courses) sel.add(new Option(c.name, c.id));
      $('pick').hidden = false;
      say('請選擇課程，再按一次「登入」。');
    } else say(err.message, true);         // 失敗不自動重送（全班共用學校網路，打錯字累計太多會暫停整個網路的登入）
  } finally { $('go').disabled = false; }
});

$('logout').addEventListener('click', () => {
  sset(TOKEN_KEY, null); sset(USER_KEY, null);
  try { sessionStorage.clear(); } catch { /* 略過 */ }   // 共用電腦換人：連同工具裡的 AI 憑證、自己的金鑰一起清掉
  location.reload();
});

// 重新整理頁面：憑證還有效就直接打開（每次都由閘道重新核對名單與課程設定）
(async () => {
  const token = sget(TOKEN_KEY), user = (() => { try { return JSON.parse(sget(USER_KEY) || 'null'); } catch { return null; } })();
  if (!token || !user) return;
  say('正在打開…');
  try {
    const d = await call(`/v1/unlock/${encodeURIComponent(APP.id)}`, { headers: { Authorization: `Bearer ${token}` } });
    await openApp(d.unlock.key, { ...user, course: d.course || user.course });
  } catch (err) {
    if (err.code !== 'network') { sset(TOKEN_KEY, null); sset(USER_KEY, null); }
    say(err.code === 'auth' ? '' : err.message, err.code !== 'auth');
  }
})();
</script>
